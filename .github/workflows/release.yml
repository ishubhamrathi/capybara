
name: CapyBara Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capybara-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a version such as 0.2.0"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check release tag
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags

          if (git tag --list $env:TAG) {
            throw "Release $env:TAG already exists. Update VERSION."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish CapyBara
        shell: pwsh
        run: |
          dotnet publish ./CapyBara.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishReadyToRun=false `
            -p:WindowsAppSDKSelfContained=true `
            -o ./artifacts/CapyBara

          if ($LASTEXITCODE -ne 0) {
            throw "CapyBara publish failed."
          }

          $exe = Get-ChildItem ./artifacts/CapyBara -Filter *.exe -File |
            Where-Object { $_.Name -ne 'msbuild.exe' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No application EXE found in publish output."
          }

          "APP_EXE_NAME=$($exe.Name)" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed."
          }

          $iscc = Get-ChildItem `
            "C:\Program Files (x86)" `
            -Filter ISCC.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) not found."
          }

          "ISCC_PATH=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_DIR: ${{ github.workspace }}\artifacts\CapyBara
        run: |
          New-Item -ItemType Directory -Force `
            -Path ./artifacts/installer | Out-Null

          & "$env:ISCC_PATH" `
            "/O$($env:GITHUB_WORKSPACE)\artifacts\installer" `
            ./installer.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed."
          }

          $installer = Get-ChildItem ./artifacts/installer `
            -Filter "CapyBara-Setup-*.exe" -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "Installer EXE was not generated."
          }

          "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:TAG `
            "$env:INSTALLER_PATH" `
            --target $env:GITHUB_SHA `
            --title "CapyBara $env:TAG" `
            --generate-notes

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed."
          }
