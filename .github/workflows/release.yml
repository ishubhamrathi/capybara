
name: CapyBara Release

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a valid version, e.g. 0.2.0"
          }

          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check version is new
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags
          if (git tag --list $env:TAG) {
            throw "Version $env:TAG already exists."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./CapyBara.csproj -r win-x64 -p:PublishReadyToRun=false

      - name: Publish
        run: >
          dotnet publish ./CapyBara.csproj
          --configuration Release
          -r win-x64
          -p:Platform=x64
          -p:PublishReadyToRun=false
          --self-contained true
          -o ./artifacts/CapyBara

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/CapyBara/* -DestinationPath ./artifacts/CapyBara-win-x64.zip

      - name: Create version tag
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:TAG
          git push origin $env:TAG

      - name: Publish GitHub Release
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            ./artifacts/CapyBara-win-x64.zip `
            --title "CapyBara $env:TAG" `
            --generate-notes