<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #202124;
      color: #e8eaed;
      font: 16px "Segoe UI", sans-serif;
    }
    .new-tab-content {
      display: grid;
      justify-items: center;
      gap: 22px;
      width: min(620px, calc(100vw - 40px));
    }
    .brand-logo { width: min(164px, 38vw); height: auto; object-fit: contain; }
    form { width: 100%; position: relative; }
    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      height: 54px;
      overflow: hidden;
      border: 1px solid #45474d;
      border-radius: 28px;
      background: #2b2d31;
    }
    .search-box:focus-within { border-color: #737780; }
    select, input, .submit {
      border: 0;
      outline: none;
      background: transparent;
      color: #e8eaed;
      font: inherit;
    }
    select {
      max-width: 130px;
      margin-left: 16px;
      color: #a4a8b0;
    }
    select option { background: #2b2d31; color: #e8eaed; }
    input {
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 0 14px;
    }
    input::placeholder { color: #a4a8b0; }
    .submit { height: 100%; padding: 0 20px; cursor: pointer; color: #a4a8b0; }
    .submit:hover { color: #e8eaed; }
    #suggestions {
      position: absolute;
      z-index: 1;
      top: calc(100% + 6px);
      left: 12px;
      right: 12px;
      display: none;
      margin: 0;
      padding: 6px;
      list-style: none;
      border: 1px solid #45474d;
      border-radius: 14px;
      background: #2b2d31;
      box-shadow: 0 8px 24px #0006;
    }
    #suggestions.visible { display: block; }
    #suggestions button {
      width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #e8eaed;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    #suggestions button:hover, #suggestions button:focus, #suggestions button[aria-selected="true"] { background: #35373d; outline: none; }
  </style>
</head>
<body>
  <main class="new-tab-content">
  <img class="brand-logo" src="https://capybara.test/Assets/CapyBaraNewTabLogo.png" alt="CapyBara" />
  <form id="search-form">
    <div class="search-box">
      <select id="engine" aria-label="Search engine">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="duckduckgo">DuckDuckGo</option>
      </select>
      <input id="query" type="search" placeholder="Search the web" aria-label="Search the web" autocomplete="off" autofocus>
      <button class="submit" type="submit">Search</button>
    </div>
    <ul id="suggestions" role="listbox" aria-label="Search suggestions"></ul>
  </form>
  </main>
  <script>
    const form = document.getElementById('search-form');
    const query = document.getElementById('query');
    const engine = document.getElementById('engine');
    const suggestions = document.getElementById('suggestions');
    let timer;
    let requestId = 0;
    let activeIndex = -1;
    let suggestionItems = [];
    let searchUrlTemplates = {};

    function hideSuggestions() {
      suggestions.replaceChildren();
      suggestions.classList.remove('visible');
      suggestionItems = [];
      activeIndex = -1;
      query.removeAttribute('aria-activedescendant');
    }

    function setActive(index) {
      if (!suggestionItems.length) return;
      activeIndex = (index + suggestionItems.length) % suggestionItems.length;
      suggestionItems.forEach((button, itemIndex) =>
        button.setAttribute('aria-selected', itemIndex === activeIndex ? 'true' : 'false'));
      query.setAttribute('aria-activedescendant', suggestionItems[activeIndex].id);
    }

    function submitSearch(value = query.value.trim()) {
      if (!value) return;
      hideSuggestions();
      const fallbackSearch = () => {
        const template = searchUrlTemplates[engine.value];
        if (template) window.location.href = template.replace('{searchTerms}', encodeURIComponent(value));
      };
      if (!window.chrome?.webview) {
        fallbackSearch();
        return;
      }

      const originalUrl = window.location.href;
      window.chrome.webview.postMessage({ type: 'search', query: value, engine: engine.value });
      setTimeout(() => {
        if (window.location.href === originalUrl) fallbackSearch();
      }, 1200);
    }

    function renderSuggestions(items) {
      hideSuggestions();
      for (const text of items) {
        const item = document.createElement('li');
        const button = document.createElement('button');
        button.id = `suggestion-${suggestionItems.length}`;
        button.type = 'button';
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', 'false');
        button.textContent = text;
        button.addEventListener('mousedown', event => event.preventDefault());
        button.addEventListener('click', () => submitSearch(text));
        item.append(button);
        suggestions.append(item);
        suggestionItems.push(button);
      }
      if (suggestionItems.length) suggestions.classList.add('visible');
    }

    function requestSuggestions() {
      clearTimeout(timer);
      const value = query.value.trim();
      if (value.length < 2 || !window.chrome?.webview) {
        hideSuggestions();
        return;
      }
      timer = setTimeout(() => {
        requestId += 1;
        window.chrome.webview.postMessage({
          type: 'suggest', id: requestId, engine: engine.value, query: value
        });
      }, 180);
    }

    query.addEventListener('input', requestSuggestions);
    engine.addEventListener('change', requestSuggestions);
    query.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' && suggestionItems.length) {
        event.preventDefault();
        setActive(activeIndex + 1);
      } else if (event.key === 'ArrowUp' && suggestionItems.length) {
        event.preventDefault();
        setActive(activeIndex < 0 ? suggestionItems.length - 1 : activeIndex - 1);
      } else if (event.key === 'Escape') {
        hideSuggestions();
      } else if (event.key === 'Enter' && activeIndex >= 0 && suggestionItems[activeIndex]) {
        event.preventDefault();
        submitSearch(suggestionItems[activeIndex].textContent);
      }
    });
    engine.addEventListener('change', () => {
      window.chrome?.webview?.postMessage({ type: 'engine', engine: engine.value });
    });
    window.chrome?.webview?.addEventListener('message', event => {
      const data = event.data;
      if (data.type === 'settings' && data.engine) {
        engine.value = data.engine;
        searchUrlTemplates = Object.fromEntries((data.engines || []).map(item => [item.id, item.searchUrlTemplate]));
        return;
      }
      if (data.type !== 'suggestions' || data.id !== requestId) return;
      renderSuggestions(data.items || []);
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      submitSearch();
    });
  </script>
</body>
</html>
